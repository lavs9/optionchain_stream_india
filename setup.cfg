[metadata]
name = optionchain-stream-india
version = 1.1.0
description = India broker option chain fetcher — WIDE format, broker-agnostic
author = Mayank Lavania
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/lavs9/optionchain_stream_india
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Topic :: Software Development :: Libraries

[options]
packages = find:
python_requires = >=3.10
# Core (models, formatter, Dhan packet decoder, chain assembler, IV) needs only requests.
# Each broker SDK is an optional extra.
install_requires =
    requests

[options.packages.find]
exclude =
    tests
    tests.*

[options.extras_require]
dhan =
    dhanhq>=2.3.0,<2.4
    websockets>=12
upstox =
    upstox-python-sdk
    pandas>=2.0.0
fyers =
    fyers-apiv3
    pandas>=2.0.0
zerodha =
    kiteconnect
    py_vollib
    pandas>=2.0.0
redis =
    redis
clickhouse =
    clickhouse-driver
s3 =
    boto3
    pandas>=2.0.0
test =
    pytest>=7
all =
    dhanhq>=2.3.0,<2.4
    websockets>=12
    upstox-python-sdk
    fyers-apiv3
    kiteconnect
    py_vollib
    pandas>=2.0.0
    redis
    clickhouse-driver
    boto3

[tool:pytest]
testpaths = tests
markers =
    integration: needs network or broker credentials (deselected by default)
addopts = -m "not integration"
