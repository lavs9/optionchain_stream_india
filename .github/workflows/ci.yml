name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"
      - name: Unit tests (integration tests deselected via setup.cfg)
        run: pytest -q

  core-only:
    # The core package (packets, chain assembler, IV, formatter) must work without broker SDKs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + test only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Core tests
        run: >
          pytest -q tests/test_dhan_packets.py tests/test_dhan_provider.py
          tests/test_chain_state.py tests/test_iv.py tests/test_dhan_feed.py
          tests/test_dhan_broker.py tests/test_wide_formatter.py tests/test_models.py
